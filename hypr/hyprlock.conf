# e-ink lock screen
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/share/wallpapers/current
    blur_passes = 3
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(545454ff)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, -200
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(333333ff)
    font_size = 96
    font_family = JetBrains Mono
    font_weight = bold
    position = 0, -240
    halign = center
    valign = top
}

label {
    monitor =
    text = $USER
    color = rgba(333333ff)
    font_size = 16
    font_family = JetBrains Mono
    font_weight = bold
    position = 0, 150
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(333333ff)
    inner_color = rgba(c2c2c2ff)
    font_color = rgba(333333ff)
    check_color = rgba(545454ff)
    fail_color = rgba(4a4a4aff)
    fade_on_empty = false
    font_family = JetBrains Mono
    placeholder_text = <i>password</i>
    hide_input = false
    position = 0, 80
    halign = center
    valign = bottom
}
