# e-ink kitty (github.com/e-ink-colorscheme)
# Palette grays: #CCCCCC #C2C2C2 #B8B8B8 #AEAEAE
#                #9A9A9A #909090 #868686 #7C7C7C
#                #727272 #686868 #5E5E5E #545454
#                #4A4A4A #474747 #333333

linux_display_server wayland
wayland_titlebar_color background

font_family JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13
background_opacity 0.80
background_blur 1

# window
remember_window_size no
initial_window_width 683
initial_window_height 384
window_padding_width 20
confirm_os_window_close 0

# colors
background #C2C2C2
foreground #333333
selection_background #9A9A9A
selection_foreground #333333
cursor #333333
cursor_text_color #C2C2C2
url_color #545454
active_border_color #333333
inactive_border_color #9A9A9A
bell_border_color #545454

# black
color0 #545454
color8 #7C7C7C
# red
color1 #5E5E5E
color9 #686868
# green
color2 #474747
color10 #545454
# yellow
color3 #5E5E5E
color11 #727272
# blue
color4 #4A4A4A
color12 #686868
# magenta
color5 #545454
color13 #7C7C7C
# cyan
color6 #474747
color14 #686868
# white
color7 #AEAEAE
color15 #CCCCCC

# tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #333333
active_tab_background   #C2C2C2
active_tab_font_style   bold
inactive_tab_foreground #7C7C7C
inactive_tab_background #AEAEAE
inactive_tab_font_style bold
tab_bar_background #B8B8B8

# keybindings
map kitty_mod+t new_tab_with_cwd
